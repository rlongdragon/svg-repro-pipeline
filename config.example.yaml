# Copy to config.yaml and edit for your OpenAI-compatible relay.
# NOTE: endpoint + key normally come from .env (SVGBENCH_BASE_URL / SVGBENCH_API_KEY),
# which OVERRIDE the values below. Fill .env instead of editing these.
api:
  base_url: ""                    # optional fallback; .env SVGBENCH_BASE_URL wins
  api_key_env: "SVGBENCH_API_KEY" # optional fallback env name; .env SVGBENCH_API_KEY wins

# Generator models to benchmark (use your relay's model ids).
models:
  - "gpt-4o"
  - "claude-3-7-sonnet"
  - "gemini-2.5-pro"

# V2 critic reviewer. Can differ from generator -> cross-model review.
reviewer_model: "gpt-4o"

run:
  mode: "diff"           # diff | critic
  max_iters: 5           # AI repair attempts (<=5 per spec)
  ssim_threshold: 0.92   # V1 stop condition (0..1)
  session: true          # generator keeps conversation memory across iters (edits its own SVG)
  render_scale: 1.0
  temperature: 0.1
  max_tokens: 40000    # verbose models (e.g. gemini flash) need headroom to finish the SVG
